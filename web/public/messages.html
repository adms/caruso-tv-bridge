<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電視訊息 · Caruso Remote</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/layout.css"><script src="/layout.js" defer></script><script src="/messages.js" defer></script></head><body><main class="shell app-shell messages-shell"><header class="app-header"><a class="brand" href="/"><span class="brand-symbol">c.</span><span>CARUSO <b>REMOTE</b></span></a><nav class="top-nav" aria-label="主要導覽"><a href="/">控制</a><a href="/messages" aria-current="page">電視訊息</a><a href="/settings">設定</a></nav><div id="connection" class="status"><span class="dot"></span><span id="connection-label">本機控制</span></div></header><div class="view-tabs" role="tablist"><button role="tab" id="tab-compose-pane" data-tab-target="compose-pane" aria-controls="compose-pane" aria-selected="true" tabindex="0">撰寫訊息</button><button role="tab" id="tab-pair-pane" data-tab-target="pair-pane" aria-controls="pair-pane" aria-selected="false" tabindex="-1">接收器配對</button></div><section id="compose-pane" class="view-panel " role="tabpanel" aria-labelledby="tab-compose-pane" data-tab-panel><section class="device-card card message-compose"><div class="section-line"><h2>電視訊息</h2><strong id="tv-status">確認接收器中…</strong></div><p id="tv-detail" class="control-note"></p>
<label for="message">訊息內容</label><textarea id="message" maxlength="560" rows="4" placeholder="例如：晚餐準備好了，記得來吃飯。"></textarea><p class="control-note" id="char-count">0 / 280 字</p>
<div class="message-options"><div><label for="message-mode">呈現方式</label><select id="message-mode"><option value="both">畫面文字＋語音播報</option><option value="display">只有畫面文字</option><option value="speech">只有語音播報</option></select>
</div><div><label for="message-duration">字幕顯示時間</label><select id="message-duration"><option value="5">5 秒</option><option value="10" selected>10 秒</option><option value="20">20 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select>
</div><div><label for="speech-volume">播報音量 <span id="speech-volume-value">60%</span></label><input id="speech-volume" type="range" min="0" max="100" value="60"></div><p class="control-note options-note">這是語音本身的音量。播報不要求節目暫停或降低音量；Apple TV 聲音能否經光纖與語音混合，仍待這台 Sony 實測。</p>
</div><div class="power-controls"><button id="send-message" disabled>傳到電視</button><button id="clear-message" disabled>清除字幕並停止播報</button></div><p id="send-result" class="control-note" role="status" aria-live="polite"></p></section></section><section id="pair-pane" class="view-panel " role="tabpanel" aria-labelledby="tab-pair-pane" data-tab-panel hidden><section class="device-card card"><div class="section-line"><h2>電視配對</h2></div><p id="pair-saved" class="pair-saved" role="status">正在讀取已保存配對…</p><div id="pair-form"><p class="control-note">在 Sony 開啟「Caruso TV Messages」，允許顯示在其他應用程式上層，開始接收訊息，再選「顯示新的 Mac 配對碼」。配對只需一次，之後直接傳送。</p><label for="pair-pin">電視上的六位數配對碼</label><div class="source-controls"><input id="pair-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="六位數配對碼"><button id="pair-tv">配對電視</button></div></div><div class="power-controls pair-saved-actions"><button id="refresh-tv">更新連線狀態</button><button id="show-pair-form" hidden>重新配對</button></div><p id="pair-result" class="control-note" role="status"></p></section></section><footer><span>CARUSO REMOTE <b>0.5.8</b></span><span>Copyright (c) 2026 Adms Chung</span></footer></main></body></html>
